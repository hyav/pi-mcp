name: Publish

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prepare npm Trusted Publishing
        run: |
          npm install --global npm@11.5.1
          node --version
          npm --version

      - name: Verify release identity
        run: npm run release:check

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run verification gate
        run: |
          npm run audit:runtime
          npm run audit:all
          npm run check
          npm test
          npm run artifact:check

      - name: Pack tarball
        run: npm pack

      - name: Create release checksum
        run: sha256sum ./*.tgz > SHA256SUMS

      - name: Check npm registry version
        id: registry_version
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).name')"
          package_version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          package_spec="${package_name}@${package_version}"
          if npm view "$package_spec" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            git_head="$(npm view "$package_spec" gitHead --registry=https://registry.npmjs.org --json)"
            git_head="${git_head//\"/}"
            if [ "$git_head" != "${GITHUB_SHA}" ]; then
              echo "${package_spec} already exists with gitHead ${git_head}; expected ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${package_spec} is already published from this release commit; skipping duplicate publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm via Trusted Publishing
        if: steps.registry_version.outputs.published != 'true'
        run: npm publish --access public

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-assets
          path: |
            ./*.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-assets
          path: release-assets

      - name: Prepare release notes
        run: npm run release:notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*.tgz
            release-assets/SHA256SUMS
          generate_release_notes: false
