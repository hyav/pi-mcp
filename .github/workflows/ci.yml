name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit runtime dependencies
        run: npm run audit:runtime

      - name: Audit all dependencies
        run: npm run audit:all

      - name: Run code check and typecheck
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Check package artifact
        run: npm run artifact:check
